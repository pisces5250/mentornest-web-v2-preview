name: mentornest-web-v2-staging

services:
  web-edge:
    image: ${WEB_EDGE_IMAGE:?必須使用已驗證的 Web immutable image digest}
    environment:
      MENTORNEST_ENV: staging
      TUTOR_BACKEND_ORIGIN: http://tutor-backend:8787
      GATEWAY_BACKEND_ORIGIN: http://tutor-backend:8787
      VOICE_BACKEND_ORIGIN: http://voice-backend:8502
    ports:
      - "${STAGING_WEB_BIND_ADDRESS:-127.0.0.1}:${STAGING_WEB_PORT:-8080}:80"
    depends_on:
      tutor-backend:
        condition: service_healthy
      voice-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [edge, private]
    restart: unless-stopped

  tutor-backend:
    image: ${TUTOR_BACKEND_IMAGE:?必須使用已驗證的 Tutor immutable image digest}
    environment:
      MENTORNEST_ENV: staging
      PORT: "8787"
      MENTORNEST_AUTH_MODE: production
      MENTORNEST_GATEWAY_SESSION_SECRET: ${MENTORNEST_GATEWAY_SESSION_SECRET:?必須由 staging secret store 注入}
      MENTORNEST_SERVICE_AUTH_KEY: ${MENTORNEST_SERVICE_AUTH_KEY:?必須由 staging secret store 注入}
      OPENCLAW_GATEWAY_ORIGIN: http://openclaw-learning:18789
      OPENCLAW_SERVICE_AUTH_KEY: ${OPENCLAW_SERVICE_AUTH_KEY:?必須由 staging secret store 注入}
      OPENCLAW_REQUIRED_CAPABILITIES: learning_director.recommend,assessment.submit_observation,learning_memory.append_observation,verified_bank.read
      OPENCLAW_CAPABILITY_CONTRACT_VERSION: "1"
      OPENCLAW_EXPECTED_RUNTIME_VERSION: ${OPENCLAW_RUNTIME_VERSION:?必須鎖定已驗證的 runtime version}
      OPENCLAW_EXPECTED_IMAGE_DIGEST: ${OPENCLAW_LEARNING_IMAGE:?必須與部署的 immutable image identity 一致}
      OPENCLAW_EXPECTED_DATA_NAMESPACE: ${STAGING_DATA_NAMESPACE:?必須與隔離 staging namespace 一致}
    expose: ["8787"]
    depends_on:
      openclaw-learning:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [private]
    restart: unless-stopped

  voice-backend:
    image: ${VOICE_BACKEND_IMAGE:?需提供已由 Voice repository 驗證的 immutable image digest}
    environment:
      MENTORNEST_ENV: staging
      PORT: "8502"
      MENTORNEST_SERVICE_AUTH_AUDIENCE: voice-backend
      MENTORNEST_SERVICE_AUTH_KEY: ${MENTORNEST_SERVICE_AUTH_KEY:?必須由 staging secret store 注入}
      ALLOWED_ORIGINS: ""
    expose: ["8502"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8502/readyz"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [private]
    restart: unless-stopped

  openclaw-learning:
    image: ${OPENCLAW_LEARNING_IMAGE:?需提供已驗證的 immutable OpenClaw image digest}
    environment:
      MENTORNEST_ENV: staging
      OPENCLAW_SERVICE_AUTH_KEY: ${OPENCLAW_SERVICE_AUTH_KEY:?必須由 staging secret store 注入}
      OPENCLAW_IMAGE_DIGEST: ${OPENCLAW_LEARNING_IMAGE:?必須與部署的 immutable image identity 一致}
      MENTORNEST_DATA_NAMESPACE: ${STAGING_DATA_NAMESPACE:?必須使用獨立 staging namespace}
      MENTORNEST_DATA_ROOT: /var/lib/mentornest-staging
      MENTORNEST_ALLOW_PRODUCTION_STUDENT_DATA: "false"
    volumes:
      - openclaw-staging-data:/var/lib/mentornest-staging
    expose: ["18789"]
    healthcheck:
      # image 內的 probe 會以短效 HMAC credential 驗證完整 /readyz，而非只測 TCP。
      test: ["CMD", "node", "src/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks: [private]
    restart: unless-stopped

networks:
  edge:
    name: ${STAGING_EDGE_NETWORK_NAME:?必須使用獨立 staging edge network 名稱}
  private:
    internal: true
    name: ${STAGING_PRIVATE_NETWORK_NAME:?必須使用獨立 staging private network 名稱}

volumes:
  openclaw-staging-data:
    name: ${STAGING_OPENCLAW_VOLUME_NAME:?必須使用獨立 staging volume 名稱}
