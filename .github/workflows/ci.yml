name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  verify-openclaw-provider:
    name: 驗證 OpenClaw provider candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 執行 provider contract tests
        run: npm test
        working-directory: provider/openclaw
      - name: 建置獨立 provider image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag mentornest-openclaw-provider:ci \
            provider/openclaw
      - name: 驗證 container runtime 與資料隔離 guards
        env:
          PROVIDER_TEST_AUTH_KEY: p09-synthetic-service-auth-key-at-least-32-characters
          PROVIDER_TEST_DIGEST: ghcr.io/mentornest/provider@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          cleanup() {
            docker logs mentornest-openclaw-provider-ci || true
            docker rm --force mentornest-openclaw-provider-ci || true
          }
          trap cleanup EXIT

          PROVIDER_TEST_CREDENTIAL="$(node --input-type=module --eval '
            import { createServiceToken } from "./server/auth/session-auth.mjs";
            process.stdout.write(createServiceToken({ subjectRef: "student_test_p09_ci", audience: "openclaw-learning" }, process.env.PROVIDER_TEST_AUTH_KEY));
          ')"
          PROVIDER_WRONG_AUDIENCE_CREDENTIAL="$(node --input-type=module --eval '
            import { createServiceToken } from "./server/auth/session-auth.mjs";
            process.stdout.write(createServiceToken({ subjectRef: "student_test_p09_ci", audience: "voice-backend" }, process.env.PROVIDER_TEST_AUTH_KEY));
          ')"
          PROVIDER_EXPIRED_CREDENTIAL="$(node --input-type=module --eval '
            import { createServiceToken } from "./server/auth/session-auth.mjs";
            process.stdout.write(createServiceToken({ subjectRef: "student_test_p09_ci", audience: "openclaw-learning", ttlSeconds: -1 }, process.env.PROVIDER_TEST_AUTH_KEY));
          ')"
          PROVIDER_ASSESSMENT_CREDENTIAL="$(node --input-type=module --eval '
            import { createServiceToken } from "./server/auth/session-auth.mjs";
            process.stdout.write(createServiceToken({ subjectRef: "student_test_p09_ci", audience: "openclaw-learning", scopes: ["service:invoke", "assessment:submit_observation"] }, process.env.PROVIDER_TEST_AUTH_KEY));
          ')"

          docker run --detach --name mentornest-openclaw-provider-ci \
            --publish 18789:18789 \
            --tmpfs /var/lib/mentornest-staging:rw,noexec,nosuid,size=16m,mode=1777 \
            --env MENTORNEST_ENV=staging \
            --env MENTORNEST_DATA_NAMESPACE=student_test_p09_staging \
            --env MENTORNEST_DATA_ROOT=/var/lib/mentornest-staging \
            --env MENTORNEST_ALLOW_PRODUCTION_STUDENT_DATA=false \
            --env OPENCLAW_SERVICE_AUTH_KEY="${PROVIDER_TEST_AUTH_KEY}" \
            --env OPENCLAW_IMAGE_DIGEST="${PROVIDER_TEST_DIGEST}" \
            mentornest-openclaw-provider:ci

          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /tmp/provider-health.json --write-out '%{http_code}' \
              --header "Authorization: Bearer ${PROVIDER_TEST_CREDENTIAL}" \
              http://127.0.0.1:18789/healthz || true)"
            if [ "${status}" = 200 ]; then break; fi
            if [ "${attempt}" = 30 ]; then
              echo "OpenClaw provider container 未在期限內啟動" >&2
              exit 1
            fi
            sleep 1
          done

          test "$(curl --silent --output /tmp/provider-unauthorized.json --write-out '%{http_code}' \
            http://127.0.0.1:18789/readyz)" = 401
          test "$(curl --silent --output /tmp/provider-wrong-audience.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${PROVIDER_WRONG_AUDIENCE_CREDENTIAL}" \
            http://127.0.0.1:18789/readyz)" = 401
          test "$(curl --silent --output /tmp/provider-expired.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${PROVIDER_EXPIRED_CREDENTIAL}" \
            http://127.0.0.1:18789/readyz)" = 401
          test "$(curl --silent --output /tmp/provider-ready.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${PROVIDER_TEST_CREDENTIAL}" \
            http://127.0.0.1:18789/readyz)" = 200
          grep --fixed-strings '"ok":true' /tmp/provider-ready.json
          grep --fixed-strings '"production_data_allowed":false' /tmp/provider-ready.json
          grep --fixed-strings '"learning_memory.append_observation"' /tmp/provider-ready.json
          grep --fixed-strings '"assessment.submit_observation"' /tmp/provider-ready.json
          test "$(curl --silent --output /tmp/provider-capabilities.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${PROVIDER_TEST_CREDENTIAL}" \
            http://127.0.0.1:18789/v1/capabilities)" = 200
          test "$(grep --only-matching '"status":"available"' /tmp/provider-capabilities.json | wc -l | tr -d ' ')" = 4

          test "$(curl --silent --output /tmp/provider-assessment.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${PROVIDER_ASSESSMENT_CREDENTIAL}" \
            --header 'Content-Type: application/json' \
            --data '{"contract_version":"1","capability":"assessment.submit_observation","subject_ref":"student_test_p09_ci","input":{"assessment_kind":"diagnostic","subject":"math","knowledge_point":"fake-kp","instrument":{"question_id":"q.fake.verified","verification_status":"verified","answer_key_version":"key-v1"},"attempt":{"response_id":"response.fake.ci","result":"correct","hints_used":0,"first_attempt":true,"occurred_at":"2026-08-30T00:00:00Z"}}}' \
            http://127.0.0.1:18789/v1/capabilities/invoke)" = 200
          grep --fixed-strings '"mastery_effect":"none"' /tmp/provider-assessment.json

          test "$(curl --silent --output /tmp/provider-invoke.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${PROVIDER_TEST_CREDENTIAL}" \
            --header 'Content-Type: application/json' \
            --data '{"contract_version":"1","capability":"learning_memory.append_observation","subject_ref":"student_test_p09_ci","input":{"observation":{"kind":"synthetic_ci"}}}' \
            http://127.0.0.1:18789/v1/capabilities/invoke)" = 200
          grep --fixed-strings '"authority":"learning_memory_writer"' /tmp/provider-invoke.json
          docker exec mentornest-openclaw-provider-ci \
            test -s /var/lib/mentornest-staging/student_test_p09_staging/learning-memory/student_test_p09_ci.jsonl

          if docker run --rm \
            --env MENTORNEST_ENV=staging \
            --env MENTORNEST_DATA_ROOT=/var/lib/mentornest-staging \
            --env MENTORNEST_ALLOW_PRODUCTION_STUDENT_DATA=false \
            --env OPENCLAW_SERVICE_AUTH_KEY="${PROVIDER_TEST_AUTH_KEY}" \
            --env OPENCLAW_IMAGE_DIGEST="${PROVIDER_TEST_DIGEST}" \
            mentornest-openclaw-provider:ci; then
            echo "缺少 staging namespace 時不應啟動" >&2
            exit 1
          fi

          if docker run --rm \
            --env MENTORNEST_ENV=staging \
            --env MENTORNEST_DATA_NAMESPACE=student_test_p09_staging \
            --env MENTORNEST_DATA_ROOT=/srv/production-learning-records \
            --env MENTORNEST_ALLOW_PRODUCTION_STUDENT_DATA=false \
            --env OPENCLAW_SERVICE_AUTH_KEY="${PROVIDER_TEST_AUTH_KEY}" \
            --env OPENCLAW_IMAGE_DIGEST="${PROVIDER_TEST_DIGEST}" \
            mentornest-openclaw-provider:ci; then
            echo "production path 不應成為 provider fallback" >&2
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 安裝 Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run verify:full
      - name: 建置 production candidate images
        run: |
          docker build --tag mentornest-web-v2:ci .
          docker build --file Dockerfile.backend --tag mentornest-tutor-backend:ci .
      - name: 驗證 Web 與 Tutor container liveness contract
        run: |
          docker network create mentornest-ci
          docker run --detach --name mentornest-tutor-ci --network mentornest-ci \
            --network-alias tutor-backend --publish 18787:8787 \
            --env MENTORNEST_GATEWAY_SESSION_SECRET=ci-session-secret-at-least-32-characters \
            --env MENTORNEST_SERVICE_AUTH_KEY=ci-service-auth-key-at-least-32-characters \
            mentornest-tutor-backend:ci
          docker run --detach --name mentornest-web-ci --network mentornest-ci \
            --env VOICE_BACKEND_ORIGIN=http://tutor-backend:8787 \
            --publish 18080:80 mentornest-web-v2:ci

          cleanup() {
            docker logs mentornest-web-ci || true
            docker logs mentornest-tutor-ci || true
            docker rm --force mentornest-web-ci mentornest-tutor-ci || true
            docker network rm mentornest-ci || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null && \
               curl --fail --silent http://127.0.0.1:18787/api/health >/tmp/tutor-health.json; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "Web／Tutor liveness contract 未在期限內就緒" >&2
              exit 1
            fi
            sleep 1
          done

          grep --fixed-strings '"ok":true' /tmp/tutor-health.json
          grep --fixed-strings '"cloud_fallback":false' /tmp/tutor-health.json
          test "$(docker inspect --format='{{.State.Health.Status}}' mentornest-web-ci)" != unhealthy
          test "$(docker inspect --format='{{.State.Health.Status}}' mentornest-tutor-ci)" != unhealthy

  publish-openclaw-provider:
    name: 發布並驗證 OpenClaw provider immutable image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    needs: verify-openclaw-provider
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: 登入 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 建置並發布 OpenClaw provider candidate image
        id: openclaw-provider-image
        env:
          PROVIDER_TAG: ghcr.io/pisces5250/mentornest-web-v2-preview-openclaw-provider:${{ github.sha }}
        run: |
          docker build --build-arg "VCS_REVISION=${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${PROVIDER_TAG}" provider/openclaw
          docker push "${PROVIDER_TAG}"
          digest="$(docker buildx imagetools inspect "${PROVIDER_TAG}" | awk '/^Digest:/ {print $2; exit}')"
          test "${digest#sha256:}" != "${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: 簽發 build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/pisces5250/mentornest-web-v2-preview-openclaw-provider
          subject-digest: ${{ steps.openclaw-provider-image.outputs.digest }}
          push-to-registry: true
      - name: 以 registry digest 重拉並驗證 container runtime
        env:
          PROVIDER_IMAGE: ghcr.io/pisces5250/mentornest-web-v2-preview-openclaw-provider@${{ steps.openclaw-provider-image.outputs.digest }}
          PROVIDER_TEST_AUTH_KEY: p010-synthetic-service-auth-key-at-least-32-characters
        run: |
          docker pull "${PROVIDER_IMAGE}"
          CREDENTIAL="$(node --input-type=module --eval '
            import { createServiceToken } from "./server/auth/session-auth.mjs";
            process.stdout.write(createServiceToken({ subjectRef: "service_readiness", audience: "openclaw-learning" }, process.env.PROVIDER_TEST_AUTH_KEY));
          ')"
          WRONG_AUDIENCE="$(node --input-type=module --eval '
            import { createServiceToken } from "./server/auth/session-auth.mjs";
            process.stdout.write(createServiceToken({ subjectRef: "service_readiness", audience: "voice-backend" }, process.env.PROVIDER_TEST_AUTH_KEY));
          ')"
          EXPIRED="$(node --input-type=module --eval '
            import { createServiceToken } from "./server/auth/session-auth.mjs";
            process.stdout.write(createServiceToken({ subjectRef: "service_readiness", audience: "openclaw-learning", ttlSeconds: -1 }, process.env.PROVIDER_TEST_AUTH_KEY));
          ')"
          INVALID_SIGNATURE="${CREDENTIAL%?}x"
          cleanup() { docker logs mentornest-openclaw-provider-evidence || true; docker rm --force mentornest-openclaw-provider-evidence || true; }
          trap cleanup EXIT
          docker run --detach --name mentornest-openclaw-provider-evidence --publish 18789:18789 \
            --tmpfs /var/lib/mentornest-staging:rw,noexec,nosuid,size=16m,mode=1777 \
            --env MENTORNEST_ENV=staging --env MENTORNEST_DATA_NAMESPACE=student_test_p010_staging \
            --env MENTORNEST_DATA_ROOT=/var/lib/mentornest-staging \
            --env MENTORNEST_ALLOW_PRODUCTION_STUDENT_DATA=false \
            --env OPENCLAW_SERVICE_AUTH_KEY="${PROVIDER_TEST_AUTH_KEY}" \
            --env OPENCLAW_IMAGE_DIGEST="${PROVIDER_IMAGE}" "${PROVIDER_IMAGE}"
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output provider-ready.json --write-out '%{http_code}' --header "Authorization: Bearer ${CREDENTIAL}" http://127.0.0.1:18789/readyz || true)"
            if [ "${status}" = 200 ]; then break; fi
            if [ "${attempt}" = 30 ]; then exit 1; fi
            sleep 1
          done
          curl --fail --silent --header "Authorization: Bearer ${CREDENTIAL}" http://127.0.0.1:18789/v1/capabilities > provider-capabilities.json
          test "$(grep --only-matching '"status":"available"' provider-capabilities.json | wc -l | tr -d ' ')" = 4
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18789/readyz)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer ${WRONG_AUDIENCE}" http://127.0.0.1:18789/readyz)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer ${EXPIRED}" http://127.0.0.1:18789/readyz)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer ${INVALID_SIGNATURE}" http://127.0.0.1:18789/readyz)" = 401
          test "$(docker inspect --format='{{.State.Health.Status}}' mentornest-openclaw-provider-evidence)" != unhealthy
          docker inspect "${PROVIDER_IMAGE}" > provider-image-inspect.json
          if docker run --rm --env MENTORNEST_ENV=staging \
            --env MENTORNEST_DATA_ROOT=/var/lib/mentornest-staging \
            --env MENTORNEST_ALLOW_PRODUCTION_STUDENT_DATA=false \
            --env OPENCLAW_SERVICE_AUTH_KEY="${PROVIDER_TEST_AUTH_KEY}" \
            --env OPENCLAW_IMAGE_DIGEST="${PROVIDER_IMAGE}" "${PROVIDER_IMAGE}"; then
            echo "缺少 staging namespace 時不得啟動" >&2
            exit 1
          fi
      - name: 保存 runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-provider-runtime-evidence-${{ github.sha }}
          path: |
            provider-ready.json
            provider-capabilities.json
            provider-image-inspect.json
          if-no-files-found: error
      - name: 記錄 immutable image evidence
        run: |
          {
            echo '## P0.10 OpenClaw provider evidence'
            echo ''
            echo '僅發布 commit SHA tag；未建立 latest 或 production tag。'
            echo ''
            echo '- OpenClaw provider digest：`${{ steps.openclaw-provider-image.outputs.digest }}`'
            echo '- Runtime evidence artifact：`openclaw-provider-runtime-evidence-${{ github.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-web-tutor:
    name: 發布 Web／Tutor immutable images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: 登入 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 建置並發布 Web／Tutor candidate images
        id: images
        env:
          WEB_TAG: ghcr.io/pisces5250/mentornest-web-v2-preview-web:${{ github.sha }}
          TUTOR_TAG: ghcr.io/pisces5250/mentornest-web-v2-preview-tutor:${{ github.sha }}
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${WEB_TAG}" .
          docker build --file Dockerfile.backend \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${TUTOR_TAG}" .
          docker push "${WEB_TAG}"
          docker push "${TUTOR_TAG}"
          web_digest="$(docker buildx imagetools inspect "${WEB_TAG}" | awk '/^Digest:/ {print $2; exit}')"
          tutor_digest="$(docker buildx imagetools inspect "${TUTOR_TAG}" | awk '/^Digest:/ {print $2; exit}')"
          test "${web_digest#sha256:}" != "${web_digest}"
          test "${tutor_digest#sha256:}" != "${tutor_digest}"
          echo "web_digest=${web_digest}" >> "${GITHUB_OUTPUT}"
          echo "tutor_digest=${tutor_digest}" >> "${GITHUB_OUTPUT}"
      - name: 簽發 Web build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/pisces5250/mentornest-web-v2-preview-web
          subject-digest: ${{ steps.images.outputs.web_digest }}
          push-to-registry: true
      - name: 簽發 Tutor build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/pisces5250/mentornest-web-v2-preview-tutor
          subject-digest: ${{ steps.images.outputs.tutor_digest }}
          push-to-registry: true
      - name: 以 digest 重拉並驗證 liveness
        env:
          WEB_IMAGE: ghcr.io/pisces5250/mentornest-web-v2-preview-web@${{ steps.images.outputs.web_digest }}
          TUTOR_IMAGE: ghcr.io/pisces5250/mentornest-web-v2-preview-tutor@${{ steps.images.outputs.tutor_digest }}
        run: |
          docker pull "${WEB_IMAGE}"
          docker pull "${TUTOR_IMAGE}"
          docker network create mentornest-p011-publish
          cleanup() {
            docker logs mentornest-p011-web || true
            docker logs mentornest-p011-tutor || true
            docker rm --force mentornest-p011-web mentornest-p011-tutor || true
            docker network rm mentornest-p011-publish || true
          }
          trap cleanup EXIT
          docker run --detach --name mentornest-p011-tutor --network mentornest-p011-publish \
            --network-alias tutor-backend --env MENTORNEST_ENV=staging \
            --env MENTORNEST_GATEWAY_SESSION_SECRET=p011-synthetic-session-secret-at-least-32-characters \
            --env MENTORNEST_SERVICE_AUTH_KEY=p011-synthetic-service-key-at-least-32-characters \
            "${TUTOR_IMAGE}"
          docker run --detach --name mentornest-p011-web --network mentornest-p011-publish \
            --publish 18080:80 "${WEB_IMAGE}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            if [ "${attempt}" = 30 ]; then exit 1; fi
            sleep 1
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' mentornest-p011-web)" != unhealthy
          test "$(docker inspect --format='{{.State.Health.Status}}' mentornest-p011-tutor)" != unhealthy
      - name: 記錄 Web／Tutor immutable evidence
        run: |
          {
            echo '## P0.11 Web／Tutor image evidence'
            echo ''
            echo '僅發布 commit SHA tag；未建立 latest 或 production tag。'
            echo ''
            echo '- Web digest：`${{ steps.images.outputs.web_digest }}`'
            echo '- Tutor digest：`${{ steps.images.outputs.tutor_digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"
