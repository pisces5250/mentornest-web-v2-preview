name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 安裝 Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run verify:full
      - name: 建置 production candidate images
        run: |
          docker build --tag mentornest-web-v2:ci .
          docker build --file Dockerfile.backend --tag mentornest-tutor-backend:ci .
