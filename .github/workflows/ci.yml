name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 安裝 Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run verify:full
      - name: 建置 production candidate images
        run: |
          docker build --tag mentornest-web-v2:ci .
          docker build --file Dockerfile.backend --tag mentornest-tutor-backend:ci .
      - name: 驗證 Web 與 Tutor container liveness contract
        run: |
          docker network create mentornest-ci
          docker run --detach --name mentornest-tutor-ci --network mentornest-ci \
            --network-alias tutor-backend --publish 18787:8787 \
            --env MENTORNEST_GATEWAY_SESSION_SECRET=ci-session-secret-at-least-32-characters \
            --env MENTORNEST_SERVICE_AUTH_KEY=ci-service-auth-key-at-least-32-characters \
            mentornest-tutor-backend:ci
          docker run --detach --name mentornest-web-ci --network mentornest-ci \
            --env VOICE_BACKEND_ORIGIN=http://tutor-backend:8787 \
            --publish 18080:80 mentornest-web-v2:ci

          cleanup() {
            docker logs mentornest-web-ci || true
            docker logs mentornest-tutor-ci || true
            docker rm --force mentornest-web-ci mentornest-tutor-ci || true
            docker network rm mentornest-ci || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null && \
               curl --fail --silent http://127.0.0.1:18787/api/health >/tmp/tutor-health.json; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "Web／Tutor liveness contract 未在期限內就緒" >&2
              exit 1
            fi
            sleep 1
          done

          grep --fixed-strings '"ok":true' /tmp/tutor-health.json
          grep --fixed-strings '"cloud_fallback":false' /tmp/tutor-health.json
          test "$(docker inspect --format='{{.State.Health.Status}}' mentornest-web-ci)" != unhealthy
          test "$(docker inspect --format='{{.State.Health.Status}}' mentornest-tutor-ci)" != unhealthy

  publish-candidate-images:
    name: 發布 commit-bound staging candidate images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 登入 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 建置並發布 Web candidate image
        id: web-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/pisces5250/mentornest-web-v2-preview-web:${{ github.sha }}
      - name: 建置並發布 Tutor candidate image
        id: tutor-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ghcr.io/pisces5250/mentornest-web-v2-preview-tutor:${{ github.sha }}
      - name: 記錄 immutable image evidence
        run: |
          {
            echo '## P0.6 GHCR candidate evidence'
            echo ''
            echo '僅發布 commit SHA tag；未建立 latest 或 production tag。'
            echo ''
            echo '- Web digest：`${{ steps.web-image.outputs.digest }}`'
            echo '- Tutor digest：`${{ steps.tutor-image.outputs.digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"
