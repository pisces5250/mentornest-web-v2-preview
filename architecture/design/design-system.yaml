human_decisions_20260827T1655Z:
  - id: R1
    topic: "math_input_library"
    decision: "native_math_keypad_first"
    rationale: "G1-G4 need a tightly-controlled, child-safe on-screen keypad; full libraries (mathlive / react-math-keyboard) only when Phase 6 (handwriting) and Phase 7 (rich equation) require them. Build a small native keypad as the v1."
    status: locked
    locked_at: 20260827T1655Z
    triggers_for_re_evaluation:
      - "Phase 6 handwriting input ships"
      - "G5+ requests rich-equation input (parent-supervised)"

  - id: R2
    topic: "drag_drop_library"
    decision: "dnd-kit"
    rationale: "Best-in-class a11y (KeyboardSensor + screen-reader announcements), zero deps conflict, MIT license, works with React 18 + Vite + TS."
    status: locked
    locked_at: 20260827T1655Z

  - id: R3
    topic: "math_svg_integration"
    decision: "math_visual_engine_render_remains_authoritative_with_controlled_react_svg_renderer"
    rationale: "math_visual_engine_render (lib) is the source of truth for SVG semantics (fraction_bar, number_line, bar_model, etc.). React component just renders the resulting SVG nodes inside the question card slot — does NOT reimplement visuals."
    status: locked
    locked_at: 20260827T1655Z

  - id: R4
    topic: "handwriting_recognition_tech (Phase 6)"
    decision: "deferred"
    rationale: "Out of scope for Phase 5/5B; revisit at Phase 6 kickoff."

  - id: R5
    topic: "G1-G2 default TTS voice_id"
    decision: "deferred"
    rationale: "audio research pending; needs sensevoice-small voice_id selection that survives the local STT pipeline."

  - id: R6
    topic: "MentorNest icon style guide"
    decision: "rounded_line_baseline"
    rationale: "Renders cleanly at small sizes (16-48px), works on high-contrast + color-vision-safe, child-friendly without being cute. No duotone or flat-only variants in v1."
    status: locked
    locked_at: 20260827T1655Z

  - id: R7
    topic: "high_contrast_palette_tokens"
    decision: "dedicated_AAA_tokens_separate_from_default"
    rationale: "Default tokens (4A90E2 primary, etc.) do NOT meet AAA 7:1 on white. A dedicated `--mn-semantic_colors-color_mode_settings-high_contrast_*` set is emitted by the token compiler, plus a button-surface override (`--mn-semantic_colors-roles-primary_button: #1d5fb6` = 5.5:1) for surfaces where dark text on the primary fill is required. WCAG 2.1 AA acceptance is via axe; AAA is the design intent but not a hard axe rule."
    status: locked
    locked_at: 20260827T1655Z

  - id: R8
    topic: "when_to_upgrade_local_to_saas_usability"
    decision: "deferred"
    rationale: "Per HD-WV2-7, Phase 1 usability is local + parent-supervised. After ≥3 locally observed sessions are reviewed and a NEW human decision supersedes HD-WV2-7, we may introduce SaaS tooling."

  - id: R9
    topic: "pdf_text_extraction_lib"
    decision: "deferred_not_a_phase_5_blocker"
    rationale: "ascii_fallback is the current default (works on text PDFs). A proper PDF parser is owed but does not block Phase 5 web v2. Revisit at Phase 5B/C when parent-upload PDFs enter scope."

  - id: R10
    topic: "license_provenance_ui"
    decision: "parent_and_admin_only_never_in_child_learning_view"
    rationale: "Children never see license/provenance indicators (AI_ORIGINAL, AI_ADAPTED, etc.) — that information surfaces only in Parent View and Admin tooling. This is enforced in age_profile_engine (`hide_provenance: true` for all child bands) and is a hard invariant."
    status: locked
    locked_at: 20260827T1655Z
    enforcement:
      - "age_profile_engine emits hide_provenance=true for G1-G2 / G3-G4 / G5-G6 / G7+"
      - "presentation_request_orchestrator MUST refuse render_spec that includes provenance in child surface"
      - "tests assert no provenance DOM appears for any child age band"

  - id: R11
    topic: "private_question_lifecycle"
    decision: "private_indefinitely_no_ttl_auto_promotion"
    rationale: "Questions marked PRIVATE stay PRIVATE unless a NEW human decision explicitly re-reviews them. There is no auto-promote by TTL, no auto-demote. Re-review is a deliberate human action."
    status: locked
    locked_at: 20260827T1655Z
    enforcement:
      - "verified_bank_lookup MUST NOT promote PRIVATE → SHARED without explicit operator action"
      - "mastery_engine_v2 / school_progress MUST NOT downgrade a verified question based on age alone"
      - "audit log records any PRIVATE state change with operator + reason"

  - id: R12
    topic: "playwright_plus_axe_core"
    decision: "approved_automated_browser_audit"
    rationale: "Phase 5A acceptance runs Playwright + axe-core in headless Chromium; this is the standard real-browser audit path for Phase 5 web v2. NOT a Phase 5 product decision — it is infrastructure acceptance tooling."
    status: not_a_human_decision_infrastructure_tooling
    note: "Locked 20260827T1655Z as part of Phase 5A acceptance. Future phases inherit this acceptance pattern unless explicitly overridden."
