      - tool: question_quality_agent_dedupe_check
        status: shipped
        tests: "covered by integration"
        notes: "Read-only pre-flight against verified bank."
      - tool: verified_bank_lookup
        status: shipped
        tests: "covered by integration"
        notes: "The ONLY retrieval interface for verified questions; consumed by generate_practice_set_v2."
      - tool: verified_bank_count
        status: shipped
        notes: "Counter; cheaper than listing."
      - tool: generate_practice_set_v2
        status: shipped
        notes: "Math-only. Bank first; explicit fallback_llm_author_required flag when empty."
      - tool: parent_setup_schema_validate
        status: shipped
        tests: 18
        notes: "One-shot parent setup; rejects school_progress (curriculum-agent only)."
      - tool: parent_setup_schema_copy
        status: shipped
        notes: "zh-TW copy strings + advanced_only flags for Web v2."

    third_batch_status: "shipped 2026-08-27"
    third_batch_tools:
