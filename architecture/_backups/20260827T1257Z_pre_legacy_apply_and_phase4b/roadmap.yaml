      - "Curriculum Agent v1 polish: bulk promotion (multi-record), inferred-record staleness expiry"
      - "Mastery Engine v2 polish: cross-subject retention aggregation, evidence-rate backfill"

    rollback_strategy:
      - "Disable any one tool in openclaw.plugin.json contracts.tools list"
      - "Revert plugins/mentornest-learning/dist/index.js from backup if needed"
      - "data/mastery/<student_id>.json is additive; deletion does not destroy learning evidence"
      - "Profile v2 fields are additive on v1 JSON; reverting to v1 read is automatic if schema_version is stripped"
      - "data/questions/<bucket>/ are isolated per bucket; deleting a bucket does not touch others"
      - "data/question-bank/index.jsonl can be regenerated by walking data/questions/verified/"

