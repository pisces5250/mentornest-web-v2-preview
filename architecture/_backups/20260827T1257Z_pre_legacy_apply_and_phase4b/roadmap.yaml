        tests: 5
        notes: "Read latest_by_subject from append-only ledger."
      - tool: school_progress_update_confirmed
        status: shipped
        notes: "Append-only. source_type ∈ {official_curriculum, parent_confirmed, teacher_material_confirmed, textbook_mapping}."
      - tool: school_progress_infer
