        tests: 9
        notes: "Per-student reader; cross-student reads forbidden."
      - tool: student_profile_v2_get
        status: shipped
        tests: "covered by integration + student_profile_v2 suite"
        notes: "Backward-compatible v2 view of v1 JSON."
      - tool: student_profile_v2_update
        status: shipped
        tests: 6
        notes: "One-shot parent setup; optional fields never requested by default."
      - tool: deterministic_math_validator
        status: shipped
        tests: 16
        notes: "Pure JS, no LLM. Fraction / decimal / percent / mixed / integer / expression equivalence."
      - tool: curriculum_map_lookup
        status: shipped
        tests: 8
        notes: "G1–G6 skeleton under architecture/curriculum/. 5 subjects. G7+ returns grade-not-in-curriculum-v1."
      - tool: mastery_store_get
        status: shipped
        tests: "covered by mastery_store suite"
      - tool: mastery_store_update
