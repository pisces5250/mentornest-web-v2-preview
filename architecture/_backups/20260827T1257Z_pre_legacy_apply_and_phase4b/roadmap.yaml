        notes: "Append-only. inferred_from_learning only. NEVER auto-marks completed."
      - tool: school_progress_promote_to_confirmed
        status: shipped
        notes: "Appends NEW record with replaces_record_id; old record stays in jsonl."
      - tool: confirmed_vs_inferred_progress_tracker
        status: shipped
        notes: "Read-only. Flags when both kinds present for same (subject, grade)."
      - tool: school_alignment
        status: shipped
        notes: "Read-only. zh-TW recommendations (對齊 / 補上進度 / 建議複習)."
      - tool: textbook_mapping_engine
        status: shipped
        tests: 6
        notes: "Curriculum Agent v1 skeleton. Fuzzy Jaccard >= 0.6 label match. NO publisher content reproduced."
      - tool: mastery_engine_v2_update_from_evidence
        status: shipped
        tests: 9
        notes: "Server-side mastery grows only from objective evidence. set_mastery REJECTED. Evidence ledger append-only."
      - tool: mastery_engine_v2_annotate_school_alignment
        status: shipped
        notes: "Curriculum-agent only. Does NOT change mastery."
      - tool: mastery_engine_v2_error_pattern_aggregation
        status: shipped
        notes: "Read-only { type: count }."
      - tool: mastery_engine_v2_retention_signal
        status: shipped
        notes: "Read-only. R(t) = 2^(-t/H) with H=21d."
      - tool: mastery_engine_v2_list_evidence
        status: shipped
        notes: "Read-only list of append-only evidence ledger."
      - tool: mastery_engine_v2_get
        status: shipped
        notes: "Read-only single record + retention_at_now."
      - tool: integration_phase2_fourth_batch
        status: shipped
        tests: 18
        notes: "End-to-end + live learning-records append-only invariant + cross-student isolation."

    fourth_batch_total_tests: 102  # 31 Phase A + 25 Phase B + 28 Phase C + 18 Phase D

    remaining_for_phase_2:
      - "Semantic duplicate detector v2 (vector-based; v1 uses Jaccard-only)"
      - "License reviewer"
      - "Difficulty calibrator (cross-difficulty bias detection)"
      - "Parent weekly report (deferred until ≥ 2 weeks of mastery data per active student)"
