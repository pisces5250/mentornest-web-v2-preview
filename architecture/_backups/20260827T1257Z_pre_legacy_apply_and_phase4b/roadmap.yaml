        status: shipped
        tests: 14
        notes: "Deterministic third-party witness for math-specialist. Hardens against string-fallback trap."
      - tool: question_bank_coverage_report
        status: shipped
        tests: 8
        notes: "Per-(KP, type, difficulty) gap list. Used by orchestrator + dashboards."
      - tool: ai_question_authoring_orchestrator_run
