phase_7_design_registry_v1:
  scope: |
    Architect and lock the MentorNest child-facing Design System.
    Phase 7 ships ONLY architecture + capability gap; no runtime code
    lands in mentornest-web until Phase 5.
  deliverables:
    - architecture/design/design-system.yaml     # entry point + handoff contract
    - architecture/design/design-tokens.yaml     # tokens: type, spacing, radius, sizes, colors, states, motion, touch
    - architecture/design/age-profiles.yaml      # G1-G2 / G3-G4 / G5-G6 / G7+ reserved
    - architecture/design/components.yaml       # question_card, hint_panel, progress_bar, feedback_state, drag_drop, math_input, voice_input
    - architecture/design/interaction-patterns.yaml  # 7 patterns + hint ladder + feedback FSM + voice UX + math input UX
    - architecture/design/accessibility.yaml     # WCAG AA + child-specific extensions + guardrails
  agent_added_to_baseline:
    - child-learning-experience-designer (architecture/agents.yaml; deferred_to_phase5)
  open_decisions_for_human:
    - actual UI redesign timing (Phase 5 web v2)
    - design system implementation tech (CSS variables vs Tailwind vs design tokens JSON)
    - whether to ship design tokens JSON as a separate npm package (mentornest-design-tokens)
    - keyboard shortcut policy for G5+ (R for replay, H for hint, etc.)

