    fourth_batch_tools:
      - tool: mentornest_question_author_production
        status: shipped
        owner: mentornest-question-author (production AI)
        tests: 13
        notes: "Calls OpenClaw gateway + MiniMax-M3 via reuse of generate_practice_set responses pattern. Privacy fence at input AND output layers. Confidence threshold >= 0.4. Malformed JSON recovered; transient 5xx retried (max 2, exp backoff). No new external API added."
