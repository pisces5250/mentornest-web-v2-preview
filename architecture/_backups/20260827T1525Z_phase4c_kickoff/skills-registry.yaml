    provider_plugin: mentornest-learning
    owner: learning-director
    status: active
    note: "Phase 2 third batch. Per-student ranked weakness list. Flags subjects with >=2 weak cells. Pure read of mastery store."

  - tool_name: learning_director_prerequisite_gap_detector
    provider_plugin: mentornest-learning
    owner: learning-director
    status: active
    note: "Phase 2 third batch. Walks curriculum prerequisite chain; returns blocking gaps + zh-TW recommendation."

  - tool_name: learning_director_weekly_strategy_emitter
    provider_plugin: mentornest-learning
    owner: learning-director
    status: active
    note: "Phase 2 third batch. Per-student WeeklyPlan: focus_areas / review_due / suggested_practice + parent_summary_for_week (zh-TW with privacy copy)."

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 2 fourth batch (2026-08-27T0809Z) — 14 new tools (43 total)
  # ─────────────────────────────────────────────────────────────────────────────

  - tool_name: mentornest_question_author_production
    provider_plugin: mentornest-learning
    owner: mentornest-question-author (production AI)
    status: active
    note: "Phase 2 fourth batch. Calls OpenClaw gateway + MiniMax-M3. Privacy fence at input AND output layers (rejects display_name / school_name / parent_concerns / raw_learning_history / voice / image / student_*.jsonl refs). Structured JSON output with schema validation; malformed JSON recovered; timeouts + retries on transient / parse errors; >= 0.4 confidence threshold. No new external API added."

  - tool_name: school_progress_get
    provider_plugin: mentornest-learning
    owner: curriculum-agent
    status: active
    note: "Phase 2 fourth batch. Reads append-only curriculum-progress jsonl for a student; returns latest_by_subject view. Cross-student reads forbidden."

  - tool_name: school_progress_update_confirmed
    provider_plugin: mentornest-learning
    owner: curriculum-agent
    status: active
    note: "Phase 2 fourth batch. Appends (never rewrites) a confirmed school-progress record. source_type ∈ {official_curriculum, parent_confirmed, teacher_material_confirmed, textbook_mapping}. confirmed_at is set; inferred_at is forbidden."

  - tool_name: school_progress_infer
    provider_plugin: mentornest-learning
    owner: curriculum-agent
    status: active
    note: "Phase 2 fourth batch. Computes an inferred record from structured evidence; appends with inferred_at only. Privacy fence on evidence payload. NEVER auto-marks completed."

  - tool_name: school_progress_promote_to_confirmed
    provider_plugin: mentornest-learning
    owner: curriculum-agent
    status: active
    note: "Phase 2 fourth batch. Builds a NEW confirmed record that supersedes a prior inferred record (carries replaces_record_id). Old record stays in jsonl — no truncation. Confidence monotonic non-decreasing."

  - tool_name: confirmed_vs_inferred_progress_tracker
    provider_plugin: mentornest-learning
    owner: curriculum-agent
    status: active
    note: "Phase 2 fourth batch. Read-only tracker returning confirmed and inferred lists separately + flags conflict when both exist for the same (subject, grade). Curriculum-agent or learning-director can consume."

  - tool_name: school_alignment
    provider_plugin: mentornest-learning
    owner: curriculum-agent
    status: active
    note: "Phase 2 fourth batch. Cross-matches mastery records against confirmed school progress; emits zh-TW recommendations (對齊 / 補上進度 / 建議複習). READ-ONLY."

  - tool_name: textbook_mapping_engine
    provider_plugin: mentornest-learning
    owner: curriculum-agent
    status: active
    note: "Phase 2 fourth batch. Maps publisher / edition / volume / unit to curriculum_unit + knowledge_points. NEVER copies publisher content. Jaccard >= 0.6 fuzzy match on labels. Curriculum Agent v1 skeleton."

  - tool_name: mastery_engine_v2_update_from_evidence
    provider_plugin: mentornest-learning
    owner: mastery-engine
    status: active
    note: "Phase 2 fourth batch. Updates mastery ONLY from objective evidence (events + assessments). set_mastery and direct mastery inputs are REJECTED. Computes quality_rating from result + hints + first_attempt + error_type. Appends to append-only evidence ledger (data/mastery-evidence/<id>.jsonl)."

  - tool_name: mastery_engine_v2_annotate_school_alignment
    provider_plugin: mentornest-learning
    owner: mastery-engine
    status: active
    note: "Phase 2 fourth batch. Records school-alignment marker on a mastery record (curriculum-agent only). NEVER affects mastery itself; mastery grows from evidence only."

  - tool_name: mastery_engine_v2_error_pattern_aggregation
    provider_plugin: mentornest-learning
    owner: mastery-engine
    status: active
    note: "Phase 2 fourth batch. Aggregates error_patterns across all records for a student into { type: count }. Read-only."

  - tool_name: mastery_engine_v2_retention_signal
    provider_plugin: mentornest-learning
    owner: mastery-engine
    status: active
    note: "Phase 2 fourth batch. Reports average_retention + stale_count across records. R(t) = 2^(-t/H) with H = 21 days. Read-only."

  - tool_name: mastery_engine_v2_list_evidence
    provider_plugin: mentornest-learning
    owner: mastery-engine
    status: active
    note: "Phase 2 fourth batch. Lists the append-only evidence ledger with subject/knowledge_point/since filters. Read-only."

  - tool_name: mastery_engine_v2_get
    provider_plugin: mentornest-learning
    owner: mastery-engine
    status: active
    note: "Phase 2 fourth batch. Reads a single mastery v2 record with current retention_at_now. Read-only."

