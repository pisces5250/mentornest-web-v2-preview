version: "1.1"

# Canonical name is the value of `name:` in each SKILL.md front-matter.
# `local_directory` is the on-disk path (relative to /home/node/.openclaw/).
# `install_source` is one of: workspace | plugin-skills | bundled-gateway | external.
# `install_slug` is the slug OpenClaw uses to reference the skill (matches the directory
#   name in plugin-skills/ or the directory name in workspace/skills/).
# `status` is one of: active | sandboxed | archived | vetted-pending | do-not-use.

