  - tool_name: student_profile_v2_update
    provider_plugin: mentornest-learning
    owner: learning-memory-agent
    status: active
    note: "Phase 2: one-shot parent setup. Optional fields are NEVER requested by default (school_name/class_name). Existing v1 fields preserved."

  - tool_name: learning_record_append
    provider_plugin: mentornest-learning
    owner: learning-memory-agent
    status: active

  - tool_name: learning_event_reader
    provider_plugin: mentornest-learning
