# 7. Agents formally added to baseline (deferred implementation)
# ──────────────────────────────────────────────────────────────────────────────
agents_baseline_locked_pending_implementation:

  - canonical_name: child-learning-experience-designer
    install_source: workspace
    install_slug: child-learning-experience-designer
    local_directory: workspace/skills/child-learning-experience-designer
    status: deferred
    deferred_to: "Phase 5+ (mentornest-web v2)"
    role: >
      UI / UX / Design System owner for child-facing surfaces (web, mobile,
      tablet). Decides presentation, interaction, cognitive-load reduction.
      Does NOT decide teaching content (Subject Specialists own that).
    responsibilities_locked:
      - Design child-facing UI
      - Maintain Design System (see architecture/design/)
      - Translate Subject Specialist presentation_request into UI components
      - Review mentornest-web UX
      - Author Web v2 implementation spec
    cannot:
      - Judge student mastery
      - Modify learning records
      - Decide how a math concept should be taught
      - Override Subject Specialist diagnosis
      - Trade accessibility / learning clarity for aesthetics
    handoff_contract:
      from: subject-specialist
      to: child-learning-experience-designer
      request_shape:
        fields: [subject, grade, question_type, representation_type,
                learning_goal, interaction_required, hint_level,
                accessibility_context]
      response_shape:
        fields: [component_type, layout, interaction_pattern, visual_priority,
                responsive_rules, child_copy]
    design_registry_path: architecture/design/
    design_registry_files:
      - design-system.yaml
      - design-tokens.yaml
      - age-profiles.yaml
      - components.yaml
      - interaction-patterns.yaml
      - accessibility.yaml
    age_profiles:
      - "G1-G2: 大尺寸操作、少文字、圖像優先、簡單導航"
      - "G3-G4: 增加結構與進度、保留適度圖像與互動"
      - "G5-G6: 不可幼兒化、成熟簡潔、視覺輔助清楚但不過度卡通"
      - "G7+: reserved (deferred)"
    personalization_bounded:
      - "simple / lively"
      - "animation tolerance"
      - "font-size preference"
      - "character guidance preference"
      must_not_break:
        - accessibility
        - consistency
        - assessment_fairness
        - subject_specialist_teaching_intent
