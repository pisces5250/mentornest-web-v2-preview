# ──────────────────────────────────────────────────────────────────────────────

phase_4_child_learning_experience_designer:
  status: architecture_only_20260827T1239Z
  plugin: mentornest-web (NOT modified this round)
  new_agent:
    canonical_name: child-learning-experience-designer
    role: child-facing UI/UX + Design System owner
    responsibilities:
      - child_facing_ui_design
      - design_system_maintenance
      - subject_specialist_to_ui_translation
      - mentornest_web_ux_review
      - web_v2_implementation_spec
      - age_appropriateness_review
      - accessibility_review
      - cognitive_load_review
    cannot:
      - judge_student_mastery
      - modify_learning_records
      - decide_teaching_content
      - override_subject_specialist_diagnosis
      - trade_accessibility_for_aesthetics
  handoff_contract:
