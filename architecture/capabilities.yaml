  components:
    MathVisualRenderer:
      status: shipped
      supported_primitives: [fraction_bar, number_line, area_model]
      engine_authoritative: math_visual_engine_render
      controlled_renderer: MathVisualRenderer.tsx
      sanitizer:
        location: src/math-rendering/svg-sanitizer.mjs
        whitelist_tags: ["svg", "g", "title", "desc", "defs", "rect", "circle", "ellipse", "line", "polyline", "polygon", "path", "text", "tspan", "marker", "clipPath", "linearGradient", "radialGradient", "stop", "pattern", "use", "symbol", "switch"]
        whitelist_attrs_case_insensitive_emit_case_sensitive: true
        strips: ["<script>", "<style>", "<foreignObject>", "on* event handlers", "style=\"...\" attribute", "data-* attributes"]
        invariants:
          - "preserves viewBox / preserveAspectRatio (case-sensitive output)"
          - "preserves engine's <title> + <desc>"
          - "wrappers carry aria-hidden=true so screen readers see sr-only text, not decorative SVG"
    NativeMathKeypad:
      status: shipped
      supported_value_kinds: [empty, integer, decimal, fraction, fraction_partial, mixed, operator_expr]
      fraction_ux:
        field_buttons: [numerator, denominator]
        focus_switching:
          click_field_button: "dispatches focus_field action"
          tab_key: "intercepts and moves DOM focus to other field"
        keypad_value_states:
          - kind: empty — submit disabled
          - kind: integer / decimal / mixed / operator_expr — submit enabled
          - kind: fraction_partial — submit disabled (incomplete)
          - kind: fraction — submit enabled
      keyboard_equivalent: "digits 0-9, ., /, +, -, backspace, clear, Enter (submit), Tab (fraction field swap), Esc (clear)"
      backspace: "removes last digit in active field"
      clear: "resets value + both fraction buffers"
      submit: "calls props.on_submit(state.value)"
      invariants:
        - "no MathLive"
        - "adapter boundary: keypad-value shape is open (new value_kinds can be added without breaking consumers)"
    AnswerValidator:
      status: shipped
      approach: "pass-through wrapper around plugins/mentornest-learning/lib/math_validator.mjs"
      behavior:
        - "accepts equivalent fractions (1/2 == 2/4 == 3/6 == ...) via gcd reduction"
        - "no LLM judgment"
        - "deterministic verdict: correct | incorrect | unverifiable"
    HintController:
      status: shipped
      source: plugins/mentornest-learning/lib/math_hint_ladder_v2.mjs (nextMathHint)
      levels: 4
      escalation:
        - "wrong #1 → level 1 conceptual nudge (text-only)"
        - "wrong #2 → level 2 fraction-bar SVG (math.G5.FRAC.add-unlike: L2_FRAC_ADD_DIFF)"
        - "wrong #3+ → level 3 intermediate structure"
        - "caps at level 3, never reveals final answer immediately"
  vertical_slice:
