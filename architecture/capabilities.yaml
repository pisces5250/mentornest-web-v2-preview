# Phase 4A — Question ingestor + segmenter (raw pool only)
# ──────────────────────────────────────────────────────────────────────────────

phase_4a_raw_question_ingestor_and_segmenter:
  status: shipped_20260827T1131Z
  plugin: mentornest-learning
  new_tools:
    - name: raw_question_ingest
      purpose: Ingest text/structured/pdf/image into RawCandidate[] (no writes)
      kinds_supported: [text, structured, pdf, image]
      pdf_image_behavior: "ok=false with errors[0].code='unsupported_in_round_4a' (no cloud OCR installed this round)"
      writes_to_disk: false
    - name: raw_question_segment
      purpose: Segment RawCandidate[] into SegmentedQuestion[] (no writes)
      types_recognized: [short_answer, multiple_choice, true_false, fill_in_blank, essay, unknown]
      writes_to_disk: false
  invariants:
    - "Raw Pool only; Verified Bank writes remain the curator's job"
    - "No new npm packages installed (no pdf-parse, no cloud OCR, no vision packages)"
    - "PDF/image binary paths fail with clean unsupported_in_round_4a error, not silent"
  test_count_phase_4a: 117
  plugin_tools_total_after_phase_4a: 132


# ──────────────────────────────────────────────────────────────────────────────
# Phase 4B — KP classifier + license + local PDF + Raw → Verified pipeline closure
# ──────────────────────────────────────────────────────────────────────────────

phase_4b_kp_classifier_license_pdf_pipeline:
  status: shipped_20260827T1518Z
  plugin: mentornest-learning
  new_tools:
    - name: kp_classify
      purpose: Taiwan G1-G6 KP classifier V1 (curriculum-keyword + signature matching); emits {matched_kp, confidence, candidates, status}
      thresholds: { match: 0.6, low_confidence: 0.3-0.6, unknown: <0.3 }
      unknown_or_low_confidence_behavior: "REJECT from Verified Bank; raw pool still keeps with status='unknown'|'low_confidence'"
      writes_to_disk: false
    - name: license_extract
      purpose: Source license extractor (PRIVATE/AI_ORIGINAL/AI_ADAPTED/CC0/CC-BY/CC-BY-SA/UNKNOWN/COMMERCIAL_RESTRICTED) with publisher sniff (翰林/康軒/南一/Pearson/Oxford/McGraw-Hill/MIT/GPL/©)
      writes_to_disk: false
    - name: license_review
      purpose: License reviewer applying decision matrix to Verified Bank eligibility
      decisions: [allow_shared, allow_private_only, requires_attribution, reject]
      forbidden_from_shared_verified_bank: [UNKNOWN, COMMERCIAL_RESTRICTED]
      writes_to_disk: false
    - name: raw_question_ingest_full_pipeline
      purpose: "End-to-end Raw → Verified pipeline: ingest → segment → KP classify → license extract → license review → quality verify"
      disposition_enum: [accepted_into_verified_bank, rejected_by_kp, rejected_by_license, rejected_by_quality, unsupported_pdf]
      writes_to_disk: "via single verified-bank writer only (question_quality_agent_verify)"
  invariants:
    - "Raw Pool only writers: raw_question_ingest, raw_question_segment, kp_classify, license_extract, license_review (no writes at all)"
    - "Single Verified Bank writer remains question_quality_agent_verify; ai_question_authoring_orchestrator and raw_question_ingest_full_pipeline MUST call it (no parallel writer)"
    - "PDF ingestion: local text extraction only (pdf-parse or pdfjs-dist if installed; else ascii_fallback); scanned/image-only PDFs return unsupported_in_round_4a"
    - "No cloud OCR installed; no Tesseract primary; no pdf-parse if not in node_modules; no pdfjs-dist if not in node_modules"
    - "License provenance (license value + review decision) is preserved end-to-end in trace"
    - "Source provenance flows from ingest → segment → KP classify → quality verify"
    - "All ingestion tests use fake IDs (student_t_*) and after() cleanup hooks"
  test_count_phase_4b: 148 # kp_classify + license_extract + license_review + pdf_local + integration
  plugin_tools_total_after_phase_4b: 136


# ──────────────────────────────────────────────────────────────────────────────
# Phase 4C — Autonomous Question Authoring & Coverage Engine
# ──────────────────────────────────────────────────────────────────────────────

phase_4c_autonomous_question_authoring_coverage_engine:
  status: shipped_20260827T1615Z
  shipping_tag: phase_4c_pipelines_shipped
  plugin: mentornest-learning
  scope: >
    Coverage-driven question authoring pipeline. No bulk cadence; no fixed batch size.
    Reads curriculum KPs + student mastery + error patterns + question-type coverage,
    produces a generation plan, and routes it through the existing AI author + quality gate.
  new_tools:
    - name: question_coverage_analyzer
      purpose: Analyze coverage gaps per (subject, grade, KP, question_type)
      inputs: { student_id?, subject, grade, kp?, error_patterns?, window_days? }
      outputs: { coverage_state: {covered, under_covered, missing}, missing_kps[], under_covered_kps[], recommended_action: "generate|monitor|skip", rationale }
      writes_to_disk: false
    - name: question_generation_planner
      purpose: Translate coverage gaps into a deterministic generation plan (counts, types, difficulty, KP confidence floor)
      inputs: { coverage_report, max_new_questions?, target_difficulty?, type_balance? }
      outputs: { plan_items: [{ kp, kp_confidence_floor, question_type, difficulty_target, count, rationale }], total_count, reason }
      hard_constraints:
        - "Only KPs with confidence >= 0.6 may be planned (Phase 4B KP classifier invariant)"
        - "Default max_new_questions=0 unless caller passes explicit budget; no bulk cadence"
      writes_to_disk: false
    - name: difficulty_controller
      purpose: Compute and apply difficulty targets per KP based on mastery + grade baseline
      inputs: { kp, grade, current_mastery?, error_rate? }
      outputs: { difficulty_target: 0..1, band: "warmup|core|challenge", rationale }
      writes_to_disk: false
    - name: variation_generator
      purpose: Generate structural variations of a seed question (numbers, contexts, surfaces) while preserving KP + answer structure
      inputs: { seed_question, variation_axes?: ["numbers","context","surface"], count }
      outputs: { variations: [{ stem, answer, surface_signature, kp, variation_axis }] }
      invariants:
        - "All variations preserve the seed's kp and answer semantics"
        - "Variations carry AI_ADAPTED provenance when seeded from a human/curated source"
      writes_to_disk: false
    - name: duplicate_detector
      purpose: Detect near-duplicates against existing verified + raw bank
      inputs: { candidate, scope: "verified|raw|all" }
      outputs: { is_duplicate: bool, duplicate_of: question_id?, similarity: 0..1, method: "exact|near|none" }
      writes_to_disk: false
    - name: answer_verifier
      purpose: Independent mathematical/logical answer verification (does NOT use question_quality_agent's kernel)
      inputs: { question, candidate_answer }
      outputs: { ok: bool, method: "deterministic|symbolic|unverifiable", reason }
      writes_to_disk: false
      invariants:
        - "Reuses math_validator kernel for math (per Phase 2 third-batch invariant); never duplicates its logic"
        - "Refuses to mark unverifiable questions as 'ok' (must fail closed)"
  extended_tools:
    - name: ai_authoring_orchestrator_run
      purpose: Extended to drive the Phase 4C pipeline (plan -> author -> verify -> dedupe -> KP classify -> license -> quality verify)
      extended_signature_only: true  # no new tool; signature grew
      single_writer_invariant: "Still delegates to question_quality_agent_verify; never writes to verified/ directly"
      provenance_policy: "All generated content carries license=AI_ORIGINAL or AI_ADAPTED"
  ai_authoring_invariants:
    - "AI-generated questions NEVER bypass question_quality_agent_verify"
    - "AI-generated questions are routed through the FULL gate: answer_verifier -> duplicate_detector -> kp_classify -> license_extract -> license_review -> question_quality_agent_verify"
    - "generated questions that fail any gate are appended to data/questions/rejected/ (write policy unchanged)"
    - "authorFn (OpenClaw -> MiniMax-M3 production authorFn) receives ONLY structured pedagogical need: { subject, grade, kp, question_type, difficulty_target, count, variation_axes?, surfaces_to_avoid? }"
    - "authorFn MUST NEVER receive: student names, raw history, audio, images, PII"
    - "No bulk cadence: no fixed period-based generation; only driven by coverage_analyzer -> generation_planner"
    - "max_new_questions default = 0; require explicit budget to exceed"
  test_count_phase_4c: 157 (8 files @ ~15 avg; coverage/planner/answer_verifier/duplicate_detector/variation/difficulty_controller/authoring_extended/integration)"
  plugin_tools_total_after_phase_4c: 142  # 136 prior + 6 new; ai_authoring_orchestrator_run EXTENDED in place, NOT added


